# Conda path for creating the `erp` development environment.
#
#     conda env create -f environment.yml     # from the REPO ROOT
#     conda activate erp
#
# Conda supplies the interpreter and pip; every actual dependency is declared
# once, in pyproject.toml. Listing numpy/scipy/matplotlib/pytest/mypy/ruff here
# as well was a second source of truth that drifted from the first -- the two
# disagreed about which tools an environment should even contain.
#
# Mixing conda and pip is the usual way conda environments break. Keeping the
# split at "conda owns the interpreter, pip owns the packages" avoids that:
# nothing is resolved twice by two solvers.
name: erp
channels:
  - conda-forge
dependencies:
  # 3.11 is what the working dev environment runs. The supported floor is 3.10
  # (`requires-python`, `[tool.mypy] python_version`, and the CI matrix), so
  # code must stay 3.10-compatible even though this environment is newer.
  - python=3.11
  - pip
  - pip:
      # The project root is the REPO root, not software/: the single packaging
      # file lives there and already points setuptools at software/src. There
      # is no pyproject.toml under software/, so "-e ./software" cannot work.
      #
      # dev = pytest/mypy/ruff, viz = matplotlib. numpy and mujoco come in as
      # core dependencies -- mujoco is not optional, it IS the process and
      # measurement model. Device access (pyserial for the Teensy, pymycobot
      # for the arm) is the `app` extra and is deliberately NOT installed here:
      # the package and its tests import cleanly without it. Add it only if you
      # intend to drive real hardware:
      #
      #     pip install -e ".[app]"
      #
      - "-e .[dev,viz]"
