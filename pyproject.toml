[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erp"
version = "0.0.0"
description = "Multi-sensor state estimation stack for robotic hands (KF/EKF/UKF fusion of inertial and contact force sensing)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy",
    "ruff",
]
viz = [
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["software/src"]

[tool.pytest.ini_options]
testpaths = ["software/tests"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "software/src"

[tool.ruff]
line-length = 100
src = ["software/src"]
