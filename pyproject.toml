[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erp"
version = "0.0.0"
description = "Multi-sensor state estimation stack for robotic hands (KF/EKF/UKF fusion of inertial and contact force sensing)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# mujoco is a HARD dependency, not an extra: `erp.sim.mujoco`, `erp.sensors.mujoco`
# and `erp.estimators.ekf` import it at module scope, because MuJoCo *is* the
# process and measurement model (it supplies f, F, h and H via mj_step and
# mjd_transitionFD). While it sat in the [app] extra, CI installed `.[dev]` and
# then type-checked a tree whose central dependency was absent.
#
# Floored at 3.11: that is the version the documented results were produced on,
# and MjSpec (used to build the blind filter model) is only stable from there.
#
# scipy was removed here -- nothing has imported it since models/discretize.py
# was deleted. Re-add it if a van Loan discretisation comes back.
# pyyaml joined at ADR-0002 P7, as a core dependency rather than an extra, on
# the same test the [app] extra fails: it is not device access. `erp.io.config`
# imports it at module scope to turn config/estimation.yaml into the typed
# dataclasses that are now the single definition of the IMU wiring, so a tree
# without it cannot construct a decoder from the config at all. It is pure
# Python and installs everywhere, so none of the reasons that keep pyserial and
# pymycobot optional apply.
dependencies = [
    "numpy",
    "mujoco>=3.11",
    "pyyaml",
]

[project.optional-dependencies]
# Floors, not pins: these are the versions the documented checks are verified
# against. ruff especially -- its *default* rule set grew from 59 rules in 0.12
# to 413 in 0.16, so an unfloored ruff made "does this tree lint clean?" a
# question about the developer's machine. [tool.ruff.lint] select below now
# fixes the rule set explicitly; the floor keeps the two consistent.
dev = [
    "pytest>=8",
    "mypy>=1.17",
    "ruff>=0.16",
]
viz = [
    "matplotlib",
]
# Device access, needed only to talk to real hardware. pyserial is imported
# lazily inside SerialIMUSensor._open, and pymycobot only by the arm driver in
# notebooks/mypalletizer260EKF.ipynb, so the package and its tests import
# cleanly without either. pyqtgraph/PyQt5 used to be here for
# scripts/finger_viewer.py, which no longer exists.
app = [
    "pyserial",
    "pymycobot",
]

# This is the ONLY packaging file in the repo, and it already points setuptools
# at the nested sources. The project root is therefore the REPO root; only the
# sources live under software/. Install with `pip install -e ".[dev]"` from here
# -- `pip install -e "./software[dev]"` cannot work, there is no build file there.
[tool.setuptools.packages.find]
where = ["software/src"]

[tool.pytest.ini_options]
testpaths = ["software/tests"]
# Most of the suite runs in ~0.4 s against a fake serial port and needs neither
# hardware nor mujoco. `mujoco` marks the tests that do: they import mujoco AND
# load MyPalletizer260.xml, which pulls STL meshes out of Git LFS, so they
# cannot run off a checkout made without LFS (this is why CI now checks out with
# lfs: true). They stay in the default run -- test_golden_run.py is M1's
# acceptance test and deselecting it would defeat the point of freezing the run
# at all. `pytest -m "not mujoco"` is the quick loop.
markers = [
    "mujoco: needs mujoco and the Git-LFS model assets; not part of the fast suite",
]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "software/src"

# mujoco ships no py.typed marker, so every `mj.*` attribute is Any. That is
# tolerable only because the boundary is narrow: erp.sim.mujoco is the single
# module that calls into it, and each of its functions wraps the result in
# np.asarray(..., dtype=np.float64) or int(...) before returning, so no Any
# leaks into the estimator. Keep that discipline when adding a function there.
[[tool.mypy.overrides]]
module = ["mujoco", "mujoco.*"]
ignore_missing_imports = true

# pyserial ships no stubs and is only in the [app] extra (absent in CI). It is
# imported lazily inside SerialIMUSensor._open, which assigns the port to a
# LineTransport-typed attribute, so no Any escapes into the sensor code.
[[tool.mypy.overrides]]
module = ["serial", "serial.*"]
ignore_missing_imports = true

# pymycobot, same arrangement: no stubs, [app] only, imported lazily inside
# MyPalletizerArm.__init__ and immediately assigned to an ArmTransport-typed
# attribute. That Protocol is the written record of the surface we depend on.
[[tool.mypy.overrides]]
module = ["pymycobot", "pymycobot.*"]
ignore_missing_imports = true

# PyYAML ships no py.typed marker, so `yaml.safe_load` is Any. Same containment
# as mujoco above, and for the same reason: erp.io.config is the only module
# that calls it, and every value it reads passes through one of that module's
# `_as_*` coercions, which return a concrete type or raise ConfigError naming
# the key. No Any reaches the dataclasses. Keep that discipline when adding a
# field. (types-PyYAML would give real signatures, but safe_load is Any either
# way, so it would buy nothing the coercions do not already have to do.)
[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

# matplotlib DOES ship py.typed, so locally mypy reads its real signatures. This
# override exists for CI, which installs .[dev] without [viz] and would
# otherwise fail to find the module at all. The asymmetry is deliberate and
# narrow: only erp.viz.theme and erp.viz.figures import it, both are withheld
# from erp/viz/__init__.py, and erp.viz.geometry -- the half with arithmetic
# worth checking -- is pure numpy and typed either way.
[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["software/src"]
# Sources must stay importable on the floor version, which is what CI runs and
# what [tool.mypy] python_version targets -- even though the dev conda env is
# newer. Without this, ruff's UP rules would rewrite to whatever the *local*
# interpreter supports.
target-version = "py310"

[tool.ruff.lint]
# Selected explicitly rather than left to ruff's default. The default set is not
# stable across ruff releases (see the dev-extra comment above), so leaving it
# implicit meant the lint result depended on which ruff happened to be resolved.
# This list is the project's policy and changes only when we change it.
#   E,F  pycodestyle + pyflakes -- the classic baseline
#   I    import sorting, so import blocks stop drifting between authors
#   UP   pyupgrade, held to target-version
#   B    bugbear -- mutable defaults and friends
#   RUF  ruff's own checks, incl. sorted __all__
select = ["E", "F", "I", "UP", "B", "RUF"]
