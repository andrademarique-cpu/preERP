# Estimation stack configuration for the MyPalletizer260.
#
# Read by erp.io.config.load_config (ADR-0002 P7), which parses this file into
# frozen dataclasses and validates it. Before P7 nothing read it, so it was
# documentation that could not drift-check itself -- and it had in fact drifted:
# the IMU wiring below was written out four times across the tree and two of the
# copies disagreed with this one. This file is now the definition; the others
# were corrected to match it.
#
# Units are stated on every physical quantity. Silent unit and frame mismatches
# are the main correctness risk in a sensor fusion codebase, so the unit is
# part of the key's meaning, not a comment for humans only.
#
# The finger sections that used to live here (`joints`, `finger_ekf`,
# `finger_ekf_blind`, `imu_proximal`, `imu_distal`, `gyro_proximal`, `encoders`)
# described a 2-link finger whose code was deleted in 1987f00. They were not
# discarded: their measured and tuned values, which are the only record of why
# those numbers were what they were, moved to ADR-0001 appendix A at P7.

time:
  # Single monotonic host time base shared by every sensor and input: absolute
  # time.perf_counter() seconds. Converting a device clock into it is a Sensor
  # responsibility and must not leak upward. Only this value is accepted.
  base: monotonic_host
  # Seconds FilterRunner holds measurements before releasing them, absorbing
  # transport latency and cross-sensor reordering. The estimate trails real
  # time by roughly this much, and the loader rejects a value below the sensor
  # latency below. 0.0 is correct for a replayed log and for a single stream;
  # this non-zero default is here for the second stream, and needs a Clock
  # passed to the runner or each sample waits for its successor.
  buffer_horizon_s: 0.050

inputs:
  # Setpoint rate, Hz. Independent of both the actuator command rate and every
  # sensor rate; the fusion layer reconciles them. This is a *scheduling*
  # parameter (ADR-0002 4.7), so RateLoop paces off its nominal period rather
  # than off the trajectory's own sample axis.
  #
  # 25 Hz is what notebooks/mypalletizer260EKF.ipynb streams at (STREAM_RATE_HZ)
  # and what the golden run was generated with. It was 200 here until P7, a
  # leftover from the finger stack that no arm run has ever used.
  rate_hz: 25
  # Commanded inputs are piecewise constant between updates. This is what the
  # hardware does, not an approximation of it.
  hold: zoh
  # Seconds between latching a command and it reaching the plant (bus/driver
  # transport). NOT the servo time constant, and NOT the ~0.395 s the arm lags
  # the MuJoCo replay by -- that is measured end to end and lives under
  # `arm_lag_s` below. TODO: unmeasured on the real chain; see ADR-0001 7.
  actuation_delay_s: 0.0

sensors:
  # MyPalletizer260: two IMUs streamed by a Teensy 3.6 over USB serial.
  # erp.sensors.SerialIMUSensor + IMUDecoder, built from here via
  # erp.io.config.build_decoder. Choosing the sensor *class* from `type` is
  # erp/runtime/session.py's job at P7.5, not the loader's (ADR-0002 4.8).
  palletizer_imu:
    type: SerialIMUSensor
    device: teensy36
    port: COM7                  # a default, not a promise: ports move between boots
    baudrate: 115200            # ignored by Teensy USB serial (always full-speed USB)
    format: kv                  # "kv" = IMU_0.ax:-9.71 ... ; "csv" = t_dev,v0..v11 (preferred)
    # Clock: the firmware sends no timestamp yet, so samples are stamped on
    # arrival minus latency_s (bias removed, jitter kept). Once lines carry
    # micros(), switch to clock: sync with device_scale 1.0e-6.
    clock: arrival              # arrival | sync
    latency_s: 0.0              # s, sample -> host arrival. TODO: unmeasured
    device_scale: 1.0e-6        # s per device tick (micros)
    clock_window_s: 2.0         # s, ClockSync minimum window
    buffer_len: 4096            # samples held between drains
    rate_hz: 20                 # measured on data/raw/imu_trajectory_log.csv (50 +- 1 ms)
    keys: [IMU_0.ax, IMU_0.ay, IMU_0.az, IMU_1.ax, IMU_1.ay, IMU_1.az,
           IMU_0.wx, IMU_0.wy, IMU_0.wz, IMU_1.wx, IMU_1.wy, IMU_1.wz]
    # MuJoCo sensor name -> device channels. IMU_0 is on link1, IMU_1 on link2.
    # Order must match rows_of(model, *layout), i.e. the XML <sensor> block --
    # the loader preserves it and a mujoco-marked test checks the rows come out
    # contiguous. This block is the one the golden fixture was generated from;
    # software/tests/conftest.py and IMUDecoder's docstring said the opposite
    # until P7 and were corrected to match, not the other way round.
    layout:
      link1_acc:  [IMU_0.ax, IMU_0.ay, IMU_0.az]
      link2_acc:  [IMU_1.ax, IMU_1.ay, IMU_1.az]
      link1_gyro: [IMU_0.wx, IMU_0.wy, IMU_0.wz]
      link2_gyro: [IMU_1.wx, IMU_1.wy, IMU_1.wz]
    # Device axes -> MuJoCo site axes, z_site = M @ z_chip, per block. Acc and
    # gyro of one chip share the matrix. Fitted 2026-09-16 against a MuJoCo
    # replay of the same trajectory (lag + all 48 signed permutations, both
    # chip->link assignments), reproduced on two independent recordings:
    # gyro rms 0.06-0.10 rad/s, acc rms 0.27-0.38 m/s^2, vs 0.34 / 2.5 for the
    # swapped wiring. Both are proper rotations (det +1) about the joint axis z;
    # the loader rejects any matrix that is not orthogonal, because one that is
    # merely close rescales the reading without changing its units.
    axis_maps:
      link1_acc:  [[0, 1, 0], [-1, 0, 0], [0, 0, 1]]   # IMU_0, Rz(-90 deg)
      link2_acc:  [[0, -1, 0], [1, 0, 0], [0, 0, 1]]   # IMU_1, Rz(+90 deg)
      link1_gyro: [[0, 1, 0], [-1, 0, 0], [0, 0, 1]]
      link2_gyro: [[0, -1, 0], [1, 0, 0], [0, 0, 1]]
    # Real arm lags the MuJoCo replay by ~395 ms (arm transport/queueing, not
    # the IMUs). Log for a tail after the last setpoint or the motion is cut.
    # Three recordings have reported 400, 405 and 400 ms against a 2.5 ms search
    # grid, so the spread is recording-to-recording, not a bug.
    arm_lag_s: 0.395
    sig_acc: 0.05               # m/s^2 per channel. Nominal, NOT measured.
    sig_gyro: 0.005             # rad/s per channel. Nominal, NOT measured.
    # calibrate() exists to replace the two above with a real R and has not been
    # run on the arm. ADR-0002 P6 measured what would happen: a rest-window R is
    # 3-8x tighter, because it is the noise floor at rest and says nothing about
    # motion or model error, so adopting it would sharpen an already
    # over-confident filter. Re-read that test before wiring it up.
    still_gyro_std: 0.02        # rad/s, calibration rejected above this
