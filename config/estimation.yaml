# Estimation stack configuration.
#
# Every estimator and model must be registered here rather than instantiated
# ad hoc in code (CLAUDE.md, "Conventions"). This is the first such file, so it
# also sets the precedent for the ones that follow.
#
# Units are stated on every physical quantity. Silent unit and frame mismatches
# are the main correctness risk in a sensor fusion codebase, so the unit is
# part of the key's meaning, not a comment for humans only.

time:
  # Single monotonic host time base shared by every sensor and input.
  # Converting a device clock into it is a Sensor responsibility.
  base: monotonic_host
  # Seconds the FusionEngine holds measurements before processing, absorbing
  # transport latency and cross-sensor reordering. The estimate trails real
  # time by roughly this much. Must exceed the worst sensor latency below.
  buffer_horizon_s: 0.050

inputs:
  # Reference/setpoint generation rate. Independent of both the actuator
  # command rate and every sensor rate; the fusion layer reconciles them.
  rate_hz: 200
  # Commanded inputs are piecewise constant between updates. This is what the
  # hardware does, not an approximation of it.
  hold: zoh
  # Seconds between latching a command and it reaching the plant (bus/driver
  # transport). Applied by InputHistory. NOT the same thing as the servo time
  # constant below, and not the same thing as sensor latency.
  # TODO: unmeasured on the real chain; see ADR-0001 section 7.
  actuation_delay_s: 0.0

# Servoed joints, proximal to distal. Mirrors notebooks/assets/finger_2link.xml,
# whose physical values live in the notebook's `actuators` dict.
joints:
  - name: joint_1
    kp: 2.0            # N*m/rad, servo proportional gain
    kv: 0.025          # N*m*s/rad, servo velocity gain
    damping: 0.003     # N*m*s/rad, structural (0.002) + gearbox (1e-3), summed
    inertia: 4.0e-5    # kg*m^2, reflected rotor inertia dominates the link here
    tau: 0.004         # s, servo activation time constant
    psd_alpha: 1.0e-2  # rad^2/s^3, angular-acceleration disturbance PSD
    psd_act: 1.0e-8    # rad^2/s, servo activation jitter PSD
  - name: joint_2
    kp: 0.8
    kv: 0.010
    damping: 0.0028    # structural (0.002) + gearbox (8e-4)
    inertia: 2.0e-5
    tau: 0.004
    psd_alpha: 1.0e-2
    psd_act: 1.0e-8

# psd_alpha is a continuous-time power spectral density in rad^2/s^3. It is NOT
# the notebook's SIG_ALPHA = 12.0 rad/s^2, which is a per-step DWNA sigma valid
# only at a fixed 2 ms tick. Converting between them is a re-derivation, not a
# unit change; the values above are placeholders pending that work.
# See ADR-0001 sections 2.1 and 3 (D3).

sensors:
  # MyPalletizer260: two IMUs streamed by a Teensy 3.6 over USB serial.
  # erp.sensors.SerialIMUSensor + IMUDecoder. No loader reads this file yet;
  # notebooks/mypalletizer260EKF.ipynb mirrors these values by hand.
  palletizer_imu:
    type: SerialIMUSensor
    device: teensy36
    port: COM7
    baudrate: 115200            # ignored by Teensy USB serial (always full-speed USB)
    format: kv                  # "kv" = IMU_0.ax:-9.71 ... ; "csv" = t_dev,v0..v11 (preferred)
    # Clock: the firmware sends no timestamp yet, so samples are stamped on
    # arrival minus latency_s (bias removed, jitter kept). Once lines carry
    # micros(), switch to clock: sync with device_scale 1.0e-6.
    clock: arrival              # arrival | sync
    latency_s: 0.0              # s, sample -> host arrival. TODO: unmeasured
    device_scale: 1.0e-6        # s per device tick (micros)
    clock_window_s: 2.0         # s, ClockSync minimum window
    buffer_len: 4096            # samples held between drains
    rate_hz: 20                 # measured on data/raw/imu_trajectory_log.csv (50 +- 1 ms)
    keys: [IMU_0.ax, IMU_0.ay, IMU_0.az, IMU_1.ax, IMU_1.ay, IMU_1.az,
           IMU_0.wx, IMU_0.wy, IMU_0.wz, IMU_1.wx, IMU_1.wy, IMU_1.wz]
    # MuJoCo sensor name -> device channels. IMU_0 is on link1, IMU_1 on link2.
    # Order must match rows_of(model, *layout), i.e. the XML <sensor> block.
    layout:
      link1_acc:  [IMU_0.ax, IMU_0.ay, IMU_0.az]
      link2_acc:  [IMU_1.ax, IMU_1.ay, IMU_1.az]
      link1_gyro: [IMU_0.wx, IMU_0.wy, IMU_0.wz]
      link2_gyro: [IMU_1.wx, IMU_1.wy, IMU_1.wz]
    # Device axes -> MuJoCo site axes, z_site = M @ z_chip, per block. Acc and
    # gyro of one chip share the matrix. Fitted 2026-09-16 against a MuJoCo
    # replay of the same trajectory (lag + all 48 signed permutations, both
    # chip->link assignments), reproduced on two independent recordings:
    # gyro rms 0.06-0.10 rad/s, acc rms 0.27-0.38 m/s^2, vs 0.34 / 2.5 for the
    # swapped wiring. Both are proper rotations (det +1) about the joint axis z.
    axis_maps:
      link1_acc:  [[0, 1, 0], [-1, 0, 0], [0, 0, 1]]   # IMU_0, Rz(-90 deg)
      link2_acc:  [[0, -1, 0], [1, 0, 0], [0, 0, 1]]   # IMU_1, Rz(+90 deg)
      link1_gyro: [[0, 1, 0], [-1, 0, 0], [0, 0, 1]]
      link2_gyro: [[0, -1, 0], [1, 0, 0], [0, 0, 1]]
    # Real arm lags the MuJoCo replay by ~395 ms (arm transport/queueing, not
    # the IMUs). Log for a tail after the last setpoint or the motion is cut.
    arm_lag_s: 0.395
    sig_acc: 0.05               # m/s^2 per channel. TODO: replace with calibrate() R
    sig_gyro: 0.005             # rad/s per channel. TODO: replace with calibrate() R
    still_gyro_std: 0.02        # rad/s, calibration rejected above this

  imu_proximal:
    model: joint_accel_model    # erp.models.measurement
    rate_hz: 1000
    latency_s: 0.001            # sample instant to host arrival
    sigma: 0.05                 # m/s^2, per channel
    frame_id: i1
  imu_distal:
    model: joint_accel_model
    rate_hz: 1000
    latency_s: 0.001
    sigma: 0.05
    frame_id: i2
  gyro_proximal:
    model: joint_block_model
    block: rate
    rate_hz: 1000
    latency_s: 0.001
    sigma: 0.005                # rad/s, per channel
    frame_id: i1
  encoders:
    model: joint_block_model
    block: angle
    rate_hz: 100
    latency_s: 0.005
    sigma: 0.0017               # rad, per channel (~0.1 deg)
    frame_id: joint

estimators:
  finger_ekf:
    type: ExtendedKalmanFilter   # erp.estimators.ekf
    process_model: servoed_finger_model
    known_input: true            # the commanded servo angle reaches the filter
    # State is [q, v, a] in blocks: angle (rad), rate (rad/s), servo
    # activation (rad). The activation block is not optional -- dropping it
    # biases every accelerometer channel in a way no Q or R tuning repairs.
    # See ADR-0001 section 2.3.
    initial_covariance:
      angle: 1.0e-4       # rad^2
      rate: 1.0e-2        # (rad/s)^2
      activation: 1.0e-4  # rad^2

  # Deployment configuration: on real hardware the setpoint lives inside the
  # servo's own controller and never reaches the estimator. The activation stops
  # being driven by u and becomes a random walk the filter estimates from the
  # observed motion, which is possible because it is observable from the encoder
  # and gyro alone (observability rank 3n).
  finger_ekf_blind:
    type: ExtendedKalmanFilter
    process_model: servoed_finger_model
    known_input: false
    # psd_act MEANS SOMETHING DIFFERENT HERE. Under known_input it is jitter
    # around a setpoint the filter already knows (1.0e-8 above). Here it must
    # cover the entire unknown actuation, and is ~5 orders larger. Inheriting
    # the jitter value is the specific mistake the falsification test guards:
    # at 1.0e-6 the filter is 959x overconfident.
    #
    # Tuned against NEES, not derived -- same caveat as psd_alpha. Measured on
    # the test harness: 8.0e-4 holds 0.918-1.039 of the chi-squared target over
    # five disjoint 20-run blocks. Re-tune if the command bandwidth changes;
    # the value scales roughly with the square of the command's rate of change.
    psd_act: 8.0e-4       # rad^2/s, random-walk PSD on the activation
    # tau is unused in this mode: there is no lag to integrate, only a walk.
    initial_covariance:
      angle: 1.0e-4       # rad^2
      rate: 1.0e-2        # (rad/s)^2
      activation: 1.0e-4  # rad^2
